name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job may read the repo and mint a Pages deployment. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags — a tag can be moved, a SHA cannot.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install --require-hashes --no-deps -r requirements.txt || pip install Pillow

      - name: Build
        run: python3 build.py

      # build.py fails the build itself if redacted content reaches site/. This is a second,
      # independent check so a regression in the builder cannot quietly publish.
      - name: Verify redactions
        run: python3 -c "import importlib.util as u; s=u.spec_from_file_location('b','build.py'); m=u.module_from_spec(s); s.loader.exec_module(m); m.guard(); print('redaction guard passed')"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
