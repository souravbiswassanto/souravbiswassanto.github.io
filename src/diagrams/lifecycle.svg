<svg viewBox="0 0 720 208" role="img" aria-labelledby="lc-title lc-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="lc-title">The PostgreSQL lifecycle as declarative operations</title>
  <desc id="lc-desc">Seven stages from provisioning to disaster recovery. Provisioning is driven by a custom resource; configuration tuning, scaling, version upgrades, credential and certificate rotation, and backup with point-in-time recovery are each a declarative operations request handled by the operator; failover and cross-datacenter recovery are handled by Raft consensus and an Open Cluster Management control plane. None of the stages requires a runbook.</desc>

  <defs>
    <marker id="lc-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity=".5"/>
    </marker>
  </defs>

  <!-- brackets -->
  <g class="d-line" stroke-width="1" fill="none">
    <path d="M 14 26 L 14 18 L 106 18 L 106 26"/>
    <path d="M 118 26 L 118 18 L 590 18 L 590 26"/>
    <path d="M 602 26 L 602 18 L 706 18 L 706 26"/>
  </g>
  <text x="60" y="12" class="d-text-sm" text-anchor="middle">PROVISION</text>
  <text x="354" y="12" class="d-text-sm" text-anchor="middle">DAY-2 OPERATIONS — DECLARATIVE, NO RUNBOOKS</text>
  <text x="654" y="12" class="d-text-sm" text-anchor="middle">RESILIENCE</text>

  <!-- connecting spine -->
  <line x1="14" y1="66" x2="706" y2="66" class="d-line" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- stage 1: provision -->
  <g>
    <rect x="14" y="40" width="92" height="52" rx="7" class="d-box-accent"/>
    <text x="60" y="62" class="d-text" text-anchor="middle" font-size="11.5" font-weight="600">Provision</text>
    <text x="60" y="79" class="d-text-sm" text-anchor="middle">Postgres CR</text>
  </g>

  <!-- stages 2-6: day-2 -->
  <g>
    <rect x="118" y="40" width="92" height="52" rx="7" class="d-box"/>
    <text x="164" y="62" class="d-text" text-anchor="middle" font-size="11.5">Tune</text>
    <text x="164" y="79" class="d-text-sm" text-anchor="middle">pgtune</text>
  </g>
  <g>
    <rect x="222" y="40" width="92" height="52" rx="7" class="d-box"/>
    <text x="268" y="62" class="d-text" text-anchor="middle" font-size="11.5">Scale</text>
    <text x="268" y="79" class="d-text-sm" text-anchor="middle">OpsRequest</text>
  </g>
  <g>
    <rect x="326" y="40" width="92" height="52" rx="7" class="d-box"/>
    <text x="372" y="62" class="d-text" text-anchor="middle" font-size="11.5">Upgrade</text>
    <text x="372" y="79" class="d-text-sm" text-anchor="middle">13 → 18</text>
  </g>
  <g>
    <rect x="430" y="40" width="92" height="52" rx="7" class="d-box"/>
    <text x="476" y="62" class="d-text" text-anchor="middle" font-size="11.5">Rotate</text>
    <text x="476" y="79" class="d-text-sm" text-anchor="middle">TLS · creds</text>
  </g>
  <g>
    <rect x="534" y="40" width="56" height="52" rx="7" class="d-box"/>
    <text x="562" y="62" class="d-text" text-anchor="middle" font-size="11.5">Back up</text>
    <text x="562" y="79" class="d-text-sm" text-anchor="middle">PITR</text>
  </g>

  <!-- stage 7: resilience -->
  <g>
    <rect x="602" y="40" width="104" height="52" rx="7" class="d-box-accent"/>
    <text x="654" y="62" class="d-text" text-anchor="middle" font-size="11.5" font-weight="600">Fail over · DR</text>
    <text x="654" y="79" class="d-text-sm" text-anchor="middle">Raft · OCM</text>
  </g>

  <!-- the automation loop underneath -->
  <path d="M 60 104 L 60 132 L 654 132 L 654 104"
        class="d-stroke-accent" stroke-width="1.5" fill="none" marker-end="url(#lc-tip)" opacity=".8"/>
  <rect x="238" y="118" width="244" height="28" rx="14" class="d-box-accent"/>
  <text x="360" y="136" class="d-accent" text-anchor="middle" font-size="11.5" font-weight="600">operator reconciles continuously</text>

  <!-- footer facts -->
  <line x1="14" y1="164" x2="706" y2="164" class="d-line" stroke-width="1"/>
  <g>
    <text x="14" y="184" class="d-text-sm">autoscaling</text>
    <text x="118" y="184" class="d-text-sm">self-healing</text>
    <text x="222" y="184" class="d-text-sm">split-brain guard</text>
    <text x="366" y="184" class="d-text-sm">sync replication</text>
    <text x="500" y="184" class="d-text-sm">chaos-tested</text>
    <text x="612" y="184" class="d-text-sm">sharded fleet</text>
  </g>
  <g>
    <text x="14" y="200" class="d-text-sm" opacity=".7">PG 9 → 18</text>
    <text x="118" y="200" class="d-text-sm" opacity=".7">25+ engines</text>
    <text x="222" y="200" class="d-text-sm" opacity=".7">arbiter node</text>
    <text x="366" y="200" class="d-text-sm" opacity=".7">quorum across DCs</text>
    <text x="500" y="200" class="d-text-sm" opacity=".7">16+ experiments</text>
    <text x="612" y="200" class="d-text-sm" opacity=".7">2000+ clusters</text>
  </g>
</svg>
