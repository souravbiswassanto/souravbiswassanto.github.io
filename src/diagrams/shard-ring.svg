<svg viewBox="0 0 720 330" role="img" aria-labelledby="ring-title ring-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="ring-title">Consistent-hash sharding across operator replicas</title>
  <desc id="ring-desc">Database clusters are hashed onto a ring, shown as tick marks. Three operator replicas sit at fixed positions on the ring, and each owns the arc that precedes its position, drawn here as three separate segments. Reconciliation therefore runs in parallel. When a replica leaves, only the clusters on its arc are redistributed; every other cluster keeps the owner it already had.</desc>

  <g transform="translate(160,158)">
    <!-- the ring itself -->
    <circle cx="0" cy="0" r="88" fill="none" class="d-line" stroke-width="1.5"/>

    <!-- three owned arcs, separated by gaps so they read as three, not one -->
    <path d="M 18.3 -86.1 A 88 88 0 0 1 83.7 27.2" fill="none" class="d-stroke-accent"
          stroke-width="7" opacity=".9" stroke-linecap="round"/>
    <path d="M 65.4 58.9 A 88 88 0 0 1 -65.4 58.9" fill="none" class="d-stroke-accent"
          stroke-width="7" opacity=".3" stroke-linecap="round"/>
    <path d="M -83.7 27.2 A 88 88 0 0 1 -18.3 -86.1" fill="none" class="d-stroke-accent"
          stroke-width="7" opacity=".58" stroke-linecap="round"/>

    <!-- hashed clusters -->
    <g class="d-line" stroke-width="1.5">
      <line x1="31" y1="-82" x2="37" y2="-98"/>
      <line x1="56" y1="-68" x2="67" y2="-81"/>
      <line x1="75" y1="-46" x2="89" y2="-56"/>
      <line x1="86" y1="-21" x2="102" y2="-25"/>
      <line x1="47" y1="74" x2="56" y2="89"/>
      <line x1="14" y1="87" x2="16" y2="104"/>
      <line x1="-25" y1="84" x2="-30" y2="100"/>
      <line x1="-59" y1="65" x2="-70" y2="78"/>
      <line x1="-84" y1="27" x2="-100" y2="32"/>
      <line x1="-88" y1="-7" x2="-105" y2="-8"/>
      <line x1="-78" y1="-41" x2="-92" y2="-49"/>
      <line x1="-52" y1="-71" x2="-62" y2="-84"/>
    </g>

    <!-- replica positions, drawn over the arcs -->
    <circle cx="0" cy="-88" r="6.5" class="d-accent"/>
    <circle cx="76" cy="44" r="6.5" class="d-accent"/>
    <circle cx="-76" cy="44" r="6.5" class="d-accent"/>

    <text x="0" y="-104" class="d-text-sm" text-anchor="middle">operator-0</text>
    <text x="111" y="68" class="d-text-sm" text-anchor="middle">operator-1</text>
    <text x="-111" y="68" class="d-text-sm" text-anchor="middle">operator-2</text>

    <text x="0" y="-4" class="d-text" text-anchor="middle" font-size="12" font-weight="600">hash ring</text>
    <text x="0" y="14" class="d-text-sm" text-anchor="middle">2000+ clusters</text>
  </g>

  <g transform="translate(324,44)">
    <rect x="0" y="0" width="394" height="60" rx="8" class="d-box"/>
    <text x="16" y="25" class="d-text" font-size="12" font-weight="600">Each replica reconciles only its own arc</text>
    <text x="16" y="45" class="d-text-sm">no shared queue, no coordination on the hot path</text>

    <rect x="0" y="76" width="394" height="60" rx="8" class="d-box"/>
    <text x="16" y="101" class="d-text" font-size="12" font-weight="600">A replica leaving moves only its arc</text>
    <text x="16" y="121" class="d-text-sm">every other cluster keeps the owner it had</text>

    <rect x="0" y="152" width="394" height="78" rx="8" class="d-box-accent"/>
    <text x="16" y="177" class="d-text" font-size="12" font-weight="600">Three correctness fixes in the hash library</text>
    <text x="16" y="197" class="d-text-sm">a division bug, a panic on a single member,</text>
    <text x="16" y="215" class="d-text-sm">and uneven distribution across the ring</text>
  </g>
</svg>
