<svg viewBox="0 0 720 330" role="img" aria-labelledby="ring-title ring-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="ring-title">Consistent-hash sharding across operator replicas</title>
  <desc id="ring-desc">Database clusters are hashed onto a ring. Each operator replica owns the arc that precedes its position, so reconciliation runs in parallel. When a replica leaves, only the clusters on its arc move, and the rest keep their owner.</desc>

  <defs>
    <marker id="rg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="d-accent"/>
    </marker>
  </defs>

  <!-- ring -->
  <g transform="translate(168,166)">
    <circle cx="0" cy="0" r="104" fill="none" class="d-line" stroke-width="1.5"/>

    <!-- arcs owned by each replica -->
    <path d="M 0 -104 A 104 104 0 0 1 90 52" fill="none" class="d-stroke-accent" stroke-width="6" opacity=".85" stroke-linecap="round"/>
    <path d="M 90 52 A 104 104 0 0 1 -90 52" fill="none" stroke="currentColor" stroke-width="6" opacity=".28" stroke-linecap="round"/>
    <path d="M -90 52 A 104 104 0 0 1 0 -104" fill="none" stroke="currentColor" stroke-width="6" opacity=".5" stroke-linecap="round"/>

    <!-- replica nodes -->
    <circle cx="0" cy="-104" r="7" class="d-accent"/>
    <circle cx="90" cy="52" r="7" class="d-accent"/>
    <circle cx="-90" cy="52" r="7" class="d-accent"/>

    <text x="0" y="-120" class="d-text-sm" text-anchor="middle">operator-0</text>
    <text x="112" y="66" class="d-text-sm" text-anchor="start">operator-1</text>
    <text x="-112" y="66" class="d-text-sm" text-anchor="end">operator-2</text>

    <!-- hashed clusters as ticks -->
    <g class="d-line" stroke-width="1.5">
      <line x1="36" y1="-97" x2="43" y2="-116"/>
      <line x1="66" y1="-80" x2="79" y2="-96"/>
      <line x1="88" y1="-55" x2="105" y2="-66"/>
      <line x1="101" y1="-25" x2="120" y2="-30"/>
      <line x1="55" y1="88" x2="66" y2="105"/>
      <line x1="16" y1="103" x2="19" y2="123"/>
      <line x1="-30" y1="100" x2="-36" y2="119"/>
      <line x1="-70" y1="77" x2="-83" y2="92"/>
      <line x1="-99" y1="32" x2="-118" y2="38"/>
      <line x1="-104" y1="-8" x2="-124" y2="-9"/>
      <line x1="-92" y1="-49" x2="-109" y2="-58"/>
      <line x1="-62" y1="-84" x2="-73" y2="-100"/>
    </g>

    <text x="0" y="-4" class="d-text" text-anchor="middle" font-size="12" font-weight="600">hash ring</text>
    <text x="0" y="14" class="d-text-sm" text-anchor="middle">2000+ clusters</text>
  </g>

  <!-- right: explanation blocks -->
  <g transform="translate(330,52)">
    <rect x="0" y="0" width="360" height="62" rx="8" class="d-box"/>
    <text x="18" y="26" class="d-text" font-size="12" font-weight="600">Each replica reconciles only its own arc</text>
    <text x="18" y="46" class="d-text-sm">no shared queue, no coordination on the hot path</text>

    <rect x="0" y="78" width="360" height="62" rx="8" class="d-box"/>
    <text x="18" y="104" class="d-text" font-size="12" font-weight="600">A replica leaving moves only its arc</text>
    <text x="18" y="124" class="d-text-sm">every other cluster keeps the owner it had</text>

    <rect x="0" y="156" width="360" height="80" rx="8" class="d-box-accent"/>
    <text x="18" y="182" class="d-text" font-size="12" font-weight="600">Three correctness fixes upstream in the library</text>
    <text x="18" y="202" class="d-text-sm">a division bug, a panic on a single member,</text>
    <text x="18" y="220" class="d-text-sm">and uneven distribution across the ring</text>
  </g>
</svg>
