<svg viewBox="0 0 720 300" role="img" aria-labelledby="mc-title mc-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="mc-title">Migrating production PostgreSQL from self-managed VMs to self-managed Kubernetes</title>
  <desc id="mc-desc">The source database on virtual machines is copied by base backup and then kept current by streaming replication, so the new Kubernetes cluster runs as a live replica for days before cutover. A full rehearsal verifies every table. On the night, writes are quiesced, the write-ahead-log position is frozen and confirmed unchanged, replay is confirmed caught up, and the replica is promoted — so the outage is the length of a promotion, not of a restore. The ledger is then compared row by row against the source before the platform opens, and the original virtual machines are kept running as a rollback path.</desc>

  <defs>
    <marker id="mc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="d-accent"/>
    </marker>
    <marker id="mc-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity=".55"/>
    </marker>
  </defs>

  <!-- source -->
  <rect x="0" y="36" width="158" height="68" rx="8" class="d-box"/>
  <text x="16" y="59" class="d-text" font-size="11.5" font-weight="600">Self-managed VMs</text>
  <text x="16" y="79" class="d-text-sm">PostgreSQL, in prod</text>
  <text x="16" y="95" class="d-text-sm">333 GB · 17 databases</text>

  <path d="M 160 70 L 190 70" class="d-stroke-accent" stroke-width="2" marker-end="url(#mc-a)" fill="none"/>
  <text x="175" y="62" class="d-text-sm" text-anchor="middle">WAL</text>

  <!-- replica -->
  <rect x="194" y="36" width="170" height="68" rx="8" class="d-box"/>
  <text x="210" y="59" class="d-text" font-size="11.5" font-weight="600">Live replica on K8s</text>
  <text x="210" y="79" class="d-text-sm">base backup, then</text>
  <text x="210" y="95" class="d-text-sm">streaming for days</text>

  <path d="M 366 70 L 396 70" class="d-line" stroke-width="1.5" marker-end="url(#mc-m)" fill="none"/>

  <!-- rehearsal gate -->
  <rect x="400" y="36" width="150" height="68" rx="8" class="d-box-accent"/>
  <text x="416" y="59" class="d-text" font-size="11.5" font-weight="600">Rehearsal gate</text>
  <text x="416" y="79" class="d-text-sm">4,003 tables</text>
  <text x="416" y="95" class="d-text-sm">verified identical</text>

  <path d="M 552 70 L 582 70" class="d-line" stroke-width="1.5" marker-end="url(#mc-m)" fill="none"/>

  <rect x="586" y="36" width="132" height="68" rx="8" class="d-box"/>
  <text x="602" y="59" class="d-text" font-size="11.5" font-weight="600">Go / no-go</text>
  <text x="602" y="79" class="d-text-sm">date agreed</text>
  <text x="602" y="95" class="d-text-sm">with the client</text>

  <line x1="0" y1="128" x2="718" y2="128" class="d-line" stroke-width="1"/>
  <text x="0" y="150" class="d-text-sm">THE CUTOVER WINDOW</text>

  <!-- cutover steps -->
  <rect x="0" y="160" width="136" height="54" rx="7" class="d-box"/>
  <text x="68" y="182" class="d-text" text-anchor="middle" font-size="11">quiesce writes</text>
  <text x="68" y="200" class="d-text-sm" text-anchor="middle">on the source</text>

  <path d="M 138 187 L 156 187" class="d-line" stroke-width="1.5" marker-end="url(#mc-m)" fill="none"/>

  <rect x="160" y="160" width="152" height="54" rx="7" class="d-box"/>
  <text x="236" y="182" class="d-text" text-anchor="middle" font-size="11">freeze the WAL position</text>
  <text x="236" y="200" class="d-text-sm" text-anchor="middle">confirmed twice</text>

  <path d="M 314 187 L 332 187" class="d-line" stroke-width="1.5" marker-end="url(#mc-m)" fill="none"/>

  <rect x="336" y="160" width="136" height="54" rx="7" class="d-box"/>
  <text x="404" y="182" class="d-text" text-anchor="middle" font-size="11">replay caught up</text>
  <text x="404" y="200" class="d-text-sm" text-anchor="middle">nothing left to ship</text>

  <path d="M 474 187 L 492 187" class="d-stroke-accent" stroke-width="2" marker-end="url(#mc-a)" fill="none"/>

  <rect x="496" y="160" width="222" height="54" rx="7" class="d-box-accent"/>
  <text x="607" y="182" class="d-text" text-anchor="middle" font-size="11.5" font-weight="600">promote the replica</text>
  <text x="607" y="200" class="d-text-sm" text-anchor="middle">standbys re-attached in 70s</text>

  <!-- outcome band -->
  <rect x="0" y="230" width="352" height="54" rx="8" class="d-box-accent"/>
  <text x="16" y="252" class="d-text" font-size="11.5" font-weight="600">Ledger proven before opening</text>
  <text x="16" y="271" class="d-text-sm">22.4M rows compared · sums equal</text>

  <rect x="366" y="230" width="352" height="54" rx="8" class="d-box"/>
  <text x="382" y="252" class="d-text" font-size="11.5" font-weight="600">Rollback path kept standing</text>
  <text x="382" y="271" class="d-text-sm">original VMs stay warm, nothing decommissioned</text>
</svg>
